<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Robbie Advanced Cleaning Control architecture</title>
  <desc id="desc">Schedules and conditions flow to the Mission Planner, Capability Detection, Adapter, existing Home Assistant vacuum integration and robot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182e"/>
      <stop offset="1" stop-color="#103458"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bb8ff"/>
      <stop offset="1" stop-color="#14d7ae"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#66d7db"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#fff" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700">From cleaning intent to the existing robot connection</text>
  <text x="70" y="104" fill="#a9c9e6" font-family="system-ui,Segoe UI,sans-serif" font-size="18">Robbie plans locally; Home Assistant integrations keep transport and authentication.</text>

  <g filter="url(#shadow)" font-family="system-ui,Segoe UI,sans-serif">
    <g transform="translate(55 150)">
      <rect width="185" height="170" rx="20" fill="#112f50" stroke="#4bb8ff" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#183f66"/>
      <path d="M38 50h20M48 40v20" stroke="#65c8ff" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="98" fill="#fff" font-size="20" font-weight="700">Schedules</text>
      <text x="28" y="126" fill="#a9c9e6" font-size="16">Weekly time or</text>
      <text x="28" y="148" fill="#a9c9e6" font-size="16">HA schedule helper</text>
    </g>
    <g transform="translate(255 150)">
      <rect width="185" height="170" rx="20" fill="#112f50" stroke="#4bb8ff" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#183f66"/>
      <path d="M36 50l8 8 17-20" fill="none" stroke="#65c8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="98" fill="#fff" font-size="20" font-weight="700">Conditions</text>
      <text x="28" y="126" fill="#a9c9e6" font-size="16">Presence, vacation,</text>
      <text x="28" y="148" fill="#a9c9e6" font-size="16">mop, availability</text>
    </g>
    <g transform="translate(500 150)">
      <rect width="195" height="170" rx="20" fill="#123c59" stroke="url(#accent)" stroke-width="3"/>
      <circle cx="48" cy="50" r="24" fill="#145171"/>
      <path d="M36 42h24M36 50h16M36 58h20" stroke="#6cf0cf" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="98" fill="#fff" font-size="20" font-weight="700">Mission Planner</text>
      <text x="28" y="126" fill="#b9eee4" font-size="16">Intent, decisions</text>
      <text x="28" y="148" fill="#b9eee4" font-size="16">and persistent state</text>
    </g>
    <g transform="translate(755 150)">
      <rect width="195" height="170" rx="20" fill="#112f50" stroke="#2fd6bf" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#164d66"/>
      <path d="M34 50h28M48 36v28M38 40l20 20M58 40L38 60" stroke="#6cf0cf" stroke-width="3" stroke-linecap="round"/>
      <text x="28" y="98" fill="#fff" font-size="19" font-weight="700">Capability Detection</text>
      <text x="28" y="126" fill="#b9eee4" font-size="16">Live HA features,</text>
      <text x="28" y="148" fill="#b9eee4" font-size="16">areas and entities</text>
    </g>
    <g transform="translate(1010 150)">
      <rect width="150" height="170" rx="20" fill="#112f50" stroke="#2fd6bf" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#164d66"/>
      <path d="M35 48l13-13 13 13-13 13z" fill="none" stroke="#6cf0cf" stroke-width="4"/>
      <text x="28" y="98" fill="#fff" font-size="20" font-weight="700">Adapter</text>
      <text x="28" y="126" fill="#b9eee4" font-size="16">Generic or</text>
      <text x="28" y="148" fill="#b9eee4" font-size="16">Valetudo</text>
    </g>
    <g transform="translate(1220 150)">
      <rect width="125" height="170" rx="20" fill="#112f50" stroke="#89a8c3" stroke-width="2"/>
      <circle cx="62" cy="50" r="28" fill="#183f66"/>
      <circle cx="62" cy="50" r="17" fill="none" stroke="#a9c9e6" stroke-width="4"/>
      <text x="62" y="101" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Existing HA</text>
      <text x="62" y="125" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">vacuum</text>
      <text x="62" y="151" text-anchor="middle" fill="#a9c9e6" font-size="15">→ robot</text>
    </g>
  </g>

  <path d="M440 235h50" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M695 235h50" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M950 235h50" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1160 235h50" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M240 205c80 0 120 20 250 20" fill="none" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M440 275c25 0 30-20 50-20" fill="none" stroke="#66d7db" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1020" y="366" fill="#8eb2d0" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Robbie boundary</text>
  <line x1="1137" y1="360" x2="1188" y2="360" stroke="#2fd6bf" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="1200" y="366" fill="#8eb2d0" font-family="system-ui,Segoe UI,sans-serif" font-size="16">delegated transport</text>
</svg>
