homeassistant:
  name: Robbie Advanced CC Lab
  latitude: 49.6116
  longitude: 6.1319
  elevation: 300
  unit_system: metric
  time_zone: Europe/Luxembourg
  currency: EUR
  # Disposable loopback-only lab: allow the Docker host to bypass the login
  # form while retaining the normal Home Assistant password provider.
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - 172.16.0.0/12
      allow_bypass_login: true
    - type: homeassistant

api:
frontend:
http:

lovelace:
  mode: yaml
  resources:
    - url: /robbie_advanced_cc/cleaning-control.js?lab=2026.8.2
      type: module

logger:
  default: warning
  logs:
    custom_components.robbie_advanced_cc: debug

robbie_advanced_cc:

robbie_advanced_cc_test_fixture:

vacuum:
  - platform: robbie_advanced_cc_test_fixture

select:
  - platform: robbie_advanced_cc_test_fixture

binary_sensor:
  - platform: robbie_advanced_cc_test_fixture

sensor:
  - platform: robbie_advanced_cc_test_fixture

input_boolean:
  vacation_mode:
    name: Vacation Mode

input_text:
  notify_route_test:
    name: Notification Route Test
    initial: persistent_notification.create
