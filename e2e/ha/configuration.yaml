homeassistant:
  name: Robbie Advanced CC Lab
  latitude: 49.6116
  longitude: 6.1319
  elevation: 300
  unit_system: metric
  time_zone: Europe/Luxembourg
  currency: EUR
  # Disposable loopback-only lab: allow the Docker host to bypass the login
  # form while retaining the normal Home Assistant password provider.
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - 172.16.0.0/12
      allow_bypass_login: true
    - type: homeassistant

api:
frontend:
http:

logger:
  default: warning
  logs:
    custom_components.robbie_advanced_cc: debug

robbie_advanced_cc:

robbie_advanced_cc_test_fixture:

vacuum:
  - platform: robbie_advanced_cc_test_fixture

select:
  - platform: robbie_advanced_cc_test_fixture

binary_sensor:
  - platform: robbie_advanced_cc_test_fixture

sensor:
  - platform: robbie_advanced_cc_test_fixture

input_boolean:
  vacation_mode:
    name: Vacation Mode
  someone_home:
    name: Somebody Home
  schedule_trigger:
    name: Schedule Trigger Fixture

input_number:
  home_occupants:
    name: Home Zone Occupants
    min: 0
    max: 10
    step: 1
    initial: 0

input_text:
  notify_route_test:
    name: Notification Route Test
    initial: persistent_notification.create
  notify_route_capture:
    name: Notification Route Capture
    initial: none
  notify_click_capture:
    name: Notification Click Capture
    initial: none
  notify_title_capture:
    name: Notification Title Capture
    initial: none
  notify_message_capture:
    name: Notification Message Capture
    initial: none

script:
  robbie_notification_router_test:
    alias: Robbie Notification Router Test
    fields:
      payload:
        description: Robbie notification payload
      route:
        description: Resolved notification route
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.notify_route_capture
        data:
          value: "{{ route | default('missing') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.notify_click_capture
        data:
          value: "{{ payload.data.clickAction | default('missing') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.notify_title_capture
        data:
          value: "{{ payload.title | default('missing') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.notify_message_capture
        data:
          value: "{{ payload.message | default('missing') }}"
