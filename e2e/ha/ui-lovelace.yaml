title: Robbie Advanced CC Lab
views:
  - title: Cleaning Control
    path: cleaning
    icon: mdi:robot-vacuum
    badges:
      - type: entity
        entity: sensor.robbie_e2e_planner_planner_status
        show_name: false
        show_icon: true
        show_state: true
        color: state
        tap_action:
          action: navigate
          navigation_path: /lovelace/cleaning
      - type: entity
        entity: sensor.robbie_e2e_planner_planner_status
        show_name: false
        show_icon: true
        show_state: true
        color: state
        visibility:
          - condition: state
            entity: sensor.robbie_e2e_planner_planner_status
            state: waiting
    cards:
      - type: custom:robbie-advanced-cleaning-card
        status_entity: sensor.robbie_e2e_planner_planner_status
        mode: simple
